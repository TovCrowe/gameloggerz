spring.application.name=gamelogger

# Local/dev datasource - matches compose.yaml. Testcontainers @ServiceConnection
# overrides these entirely for the integration test.
spring.datasource.url=jdbc:postgresql://localhost:5432/gamelogger
spring.datasource.username=gamelogger
spring.datasource.password=gamelogger

# Schema comes only from Flyway migrations - Hibernate must never manage DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Local-dev-only fallback secret (64 hex chars, well above the HS256 256-bit
# minimum). Any deployed environment must set JWT_SECRET for real.
jwt.secret=${JWT_SECRET:6f1f4a9c2e7b4d3a8f0c5e6b1a2d3c4e5f60718293a4b5c6d7e8f90a1b2c3d4e}
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=30d

# RAWG API integration (REQ-003). No safe dev default exists for a real
# external key, so rawg.api-key defaults to blank rather than a fake
# value - the app still starts and every other endpoint/test works with
# it unset. A blank/invalid key doesn't fail startup; it fails the
# specific /games/search call at request time with a 502.
rawg.base-url=${RAWG_BASE_URL:https://api.rawg.io/api}
rawg.api-key=${RAWG_API_KEY:}
