services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gamelogger
      POSTGRES_USER: gamelogger
      POSTGRES_PASSWORD: gamelogger
    ports:
      - "5432:5432"
    volumes:
      - gamelogger-postgres-data:/var/lib/postgresql/data

volumes:
  gamelogger-postgres-data:
